<html>

<head>

  <style>
    body {
      background-color: #1D1D24;
      cursor: default;
      user-select: none;
    }

    #trays {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      height: 96px;
      margin-bottom: 16px;
    }

    #trays>.tray {
      position: relative;
      background-color: rgba(0, 0, 0, 0.1);
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #trays>.tray.is-active:before {
      content: "";
      display: block;
      position: absolute;
      left: -5px;
      top: -5px;
      right: -5px;
      bottom: -5px;
      border: 2px solid #65C466;
      border-radius: 14px;
    }

    #trays>.tray>.type {
      color: white;
      font-size: 18px;
      font-weight: 500;
    }

    #trays>.tray.is-light>.type {
      color: black;
    }

    /* the part of the spool that is used up, from the top down */
    #trays>.tray::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: calc((100 - var(--left, 100)) * 1%);
      background-color: rgba(0, 0, 0, 0.45);
      border-radius: 10px 10px 0 0;
      pointer-events: none;
    }

    #trays>.tray>.type,
    #trays>.tray>.left {
      position: relative;
      z-index: 1;
    }

    #trays>.tray {
      flex-direction: column;
    }

    #trays>.tray>.left {
      color: white;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
    }

    #trays>.tray.is-light>.left {
      color: black;
    }

    #trays>.tray>.left:empty {
      display: none;
    }

    #trays>.tray[hidden] {
      display: none;
    }

    #sensors-wrap {
      text-align: center;
    }

    #sensors {
      display: inline-block;
      margin: auto;
      border-radius: 13px;
      height: 26px;
      box-sizing: border-box;
      white-space: nowrap;
      padding: 0 10px;

      flex-direction: row;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background-color: #35363E;
    }

    #sensors>.sensor {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #9A9A9F;
    }

    #sensors>.sensor>.icon {
      display: block;
      width: 18px;
      height: 18px;
      margin-right: 4px;
      background-position: center center;
      background-size: contain;
      background-repeat: no-repeat;
    }

    #sensors>#sensor-temperature>.icon {
      background-image: url('temperature.svg');
    }

    #sensors>#sensor-humidity>.icon {
      background-image: url('humidity.svg');
    }

    #sensors>.sensor>.text {
      font-size: 14px;
      margin-top: 2px;
      line-height: 18px;
      font-weight: 500;
      color: #9A9A9F;
    }

    #sensors>.sensor:first-child::after {
      content: " ・ ";
    }

    #error {
      position: absolute;
      z-index: 10;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);

      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      text-align: center;
    }

    #error:empty {
      display: none;
    }
  </style>
</head>

<body class="homey-widget">

  <div id="error"></div>

  <div id="trays">
    <div
      data-tray="0"
      class="tray"
    >
      <div class="type"></div>
      <div class="left"></div>
    </div>

    <div
      data-tray="1"
      class="tray"
    >
      <div class="type"></div>
      <div class="left"></div>
    </div>

    <div
      data-tray="2"
      class="tray"
    >
      <div class="type"></div>
      <div class="left"></div>
    </div>

    <div
      data-tray="3"
      class="tray"
    >
      <div class="type"></div>
      <div class="left"></div>
    </div>
  </div>

  <div id="sensors-wrap">
    <div id="sensors">
      <div
        id="sensor-humidity"
        class="sensor"
      >
        <div class="icon"></div>
        <div class="text"></div>
      </div>
      <div
        id="sensor-temperature"
        class="sensor"
      >
        <div class="icon"></div>
        <div class="text"></div>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const {
        device,
        ams,
      } = Homey.getSettings();
      const { deviceId } = device;
      const { amsId } = ams;

      function getStatus() {
        Homey.api('GET', `/status?deviceId=${deviceId}&amsId=${amsId}`, {})
          .then(({
            temperature,
            humidity,
            trays,
            trayLoadedId,
          }) => {
            document.getElementById('trays').style.gridTemplateColumns = `repeat(${trays.length}, 1fr)`;
            for (let i = 0; i < 4; i++) {
              const el = document.querySelector(`[data-tray="${i}"]`);
              const tray = trays[i];
              el.hidden = !tray;
              if (!tray) continue;

              const color = /^#[0-9a-f]{6}$/i.test(tray.color) ? tray.color : null;
              el.style.backgroundColor = color ?? 'rgba(0, 0, 0, 0.1)';
              el.classList.toggle('is-light', !!color && lightOrDark(color) === 'light');
              el.classList.toggle('is-active', Number(trayLoadedId) === Number(tray.id) + Number(amsId) * 4);
              el.querySelector('.type').innerText = tray.type ?? '';

              // how full the spool is: the colour fills up to that level, the grams (or percentage) below the type
              const remain = typeof tray.remain === 'number' ? tray.remain : null;
              el.style.setProperty('--left', String(remain ?? 100));
              let left = '';
              if (remain !== null && tray.weight) left = `${Math.round((remain / 100) * tray.weight)} g`;
              else if (remain !== null) left = `${remain}%`;
              el.querySelector('.left').innerText = left;
            }

            document.querySelector('#sensor-temperature > .text').innerText = `${temperature}°C`;
            document.querySelector('#sensor-humidity > .text').innerText = `${humidity}`;

            document.getElementById('error').innerText = '';
          })
          .catch(err => {
            console.error(err);
            document.getElementById('error').innerText = `${err.message}`;
          })
          .finally(() => {
            Homey.ready();
          });
      };

      getStatus();
      setInterval(getStatus, 1000);
    }

    function lightOrDark(color) {

      // Check the format of the color, HEX or RGB?
      if (color.match(/^rgb/)) {

        // If HEX --> store the red, green, blue values in separate variables
        color = color.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*(\d+(?:\.\d+)?))?\)$/);

        r = color[1];
        g = color[2];
        b = color[3];
      } else {

        // If RGB --> Convert it to HEX: http://gist.github.com/983661
        color = +("0x" + color.slice(1).replace(
          color.length < 5 && /./g, '$&$&'
        )
        );

        r = color >> 16;
        g = color >> 8 & 255;
        b = color & 255;
      }

      // HSP equation from http://alienryderflex.com/hsp.html
      hsp = Math.sqrt(
        0.299 * (r * r) +
        0.587 * (g * g) +
        0.114 * (b * b)
      );

      // Using the HSP value, determine whether the color is light or dark
      if (hsp > 127.5) {
        return 'light';
      } else {
        return 'dark';
      }
    }
  </script>
</body>

</html>
